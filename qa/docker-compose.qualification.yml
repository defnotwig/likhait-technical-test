services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: qa_root_password
      MYSQL_DATABASE: expense_system_qa
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_password
    command: ["--innodb-buffer-pool-size=256M"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pqa_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - qa_mysql:/var/lib/mysql
    networks: [qa_network]

  backend:
    build:
      context: ${QA_SOURCE_ROOT:-..}/backend
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      RAILS_FORCE_SSL: "false"
      SECRET_KEY_BASE: qa-only-not-a-production-secret-00000000000000000000000000000000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: expense_system_qa
      DATABASE_USERNAME: qa_user
      DATABASE_PASSWORD: qa_password
      RAILS_MAX_THREADS: 5
      WEB_CONCURRENCY: 2
      RAILS_LOG_LEVEL: warn
      QA_EPHEMERAL_DATABASE: "1"
      QA_EXPENSE_COUNT: ${QA_EXPENSE_COUNT:-10000}
      QA_SEED: ${QA_SEED:-20260801}
    ports:
      - "${QA_BACKEND_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        attempt=0;
        until bundle exec rails db:prepare; do
          attempt=$$((attempt + 1));
          if [ $$attempt -ge 30 ]; then
            echo 'Database preparation did not recover within 60 seconds' >&2;
            exit 1;
          fi;
          sleep 2;
        done &&
        bundle exec rails runner script/qa_seed.rb &&
        bundle exec rails server -b 0.0.0.0
      "
    networks: [qa_network]

  frontend:
    build:
      context: ${QA_SOURCE_ROOT:-..}/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:${QA_BACKEND_PORT:-3100}
    ports:
      - "${QA_FRONTEND_PORT:-5174}:4173"
    depends_on: [backend]
    command: >
      sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    networks: [qa_network]

  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    environment:
      QA_API_URL: http://backend:3000/api
      QA_PROFILE: ${QA_PROFILE:-ci}
      QA_SEED: ${QA_SEED:-20260801}
    volumes:
      - ./k6:/scripts:ro
      - ./artifacts:/artifacts
    depends_on: [backend]
    networks: [qa_network]

volumes:
  qa_mysql:

networks:
  qa_network:
